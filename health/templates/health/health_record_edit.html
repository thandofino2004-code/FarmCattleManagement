{% extends "cattle/base.html" %}
{% load static %}

{% block title %}Edit Health Record{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h4><i class="fas fa-edit"></i> Edit Health Record</h4>
                    <p class="text-muted">For {{ cattle.gov_tag }} - {{ cattle.name|default:"Unnamed" }}</p>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Health Status *</label>
                            <select name="health_status" class="form-control" required>
                                <option value="">Select Status</option>
                                {% for choice in health_status_choices %}
                                    <option value="{{ choice.0 }}" {% if form_data.health_status == choice.0 %}selected{% endif %}>
                                        {{ choice.1 }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Symptoms</label>
                            <textarea name="symptoms" class="form-control" rows="3">{{ form_data.symptoms|default:'' }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Treatment Given</label>
                            <textarea name="treatment" class="form-control" rows="3">{{ form_data.treatment|default:'' }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Additional Notes</label>
                            <textarea name="notes" class="form-control" rows="2">{{ form_data.notes|default:'' }}</textarea>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Update Record
                            </button>
                            <a href="{% url 'cattle:cattle_detail' cattle.id %}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
